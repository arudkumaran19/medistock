services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: medistock-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}

    ports:
      - "5434:5432"

    volumes:
      - medistock-postgres:/var/lib/postgresql/data

volumes:
  medistock-postgres:
