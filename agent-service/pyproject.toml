# SHARED SCAFFOLDING - NOT owned by the Demand vertical.
# Created by Sathurstiga S. (IT24103156) only so the Demand & Shortage Agent is
# runnable and testable. The agent-service owners replace this on integration.

[project]
name = "medistock-agents"
version = "0.1.0"
description = "MediStock Agentic AI service"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
