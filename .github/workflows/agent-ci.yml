name: Agent Service CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - develop
    paths:
      - 'agent-service/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'agent-service/**'
      - '.github/workflows/agent-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Agent Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    # Tests never call a real model. The suite uses scripted stand-ins, and
    # these pin the service to its offline paths so CI needs no API key.
    env:
      DEMAND_AGENT_REASONING: "false"
      LLM_PROVIDER: mock
      JWT_SIGNING_KEY: "test-only-deterministic-agent-service-signing-key-for-unit-testing-32-bytes-minimum"
      JWT_ISSUER: "MediStock.Api"
      JWT_AUDIENCE: "MediStock.Client"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio

      - name: Run tests
        run: python -m pytest tests --verbosity=2
