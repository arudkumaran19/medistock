name: Agent Service CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'agent-service/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'agent-service/**'
      - '.github/workflows/agent-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Agent Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio

      - name: Run Pytest
        run: pytest tests --verbosity=2
