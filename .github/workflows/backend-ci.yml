name: Backend CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - develop
    paths:
      - 'backend/**'
      - 'MediStock.sln'
      - 'backend/MediStock.sln'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'MediStock.sln'
      - 'backend/MediStock.sln'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ./backend/MediStock.sln

      - name: Build Solution
        run: dotnet build ./backend/MediStock.sln --no-restore --configuration Release

      - name: Run xUnit Tests
        run: dotnet test ./backend/MediStock.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx
          if-no-files-found: warn
